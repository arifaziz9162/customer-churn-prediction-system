[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-prediction"
version = "1.0.0"
description = "End-to-end ML project for customer churn prediction"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "pandas",
  "numpy",
  "python-dotenv",
  "kaggle",
  "scikit-learn",
  "mlflow",
  "dvc",
  "dagshub",
  "optuna",
  "alembic",
  "sqlalchemy",
  "psycopg2-binary",
  "PyYAML",
  "python-box",
  "ensure",
  "joblib",
  "matplotlib",
  "seaborn"
]

authors = [
    { name = "Md Arif Aziz", email = "arifaziz0125@gmail.com" }
]

license = { text = "MIT" }

keywords = [
    "mlops",
    "machine-learning",
    "customer-churn",
    "classification",
    "dvc",
    "mlflow",
    "bentoml",
    "kubernetes",
    "docker",
    "aws"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License"
]

[project.urls]
Homepage = "https://github.com/arifaziz9162/customer-churn-prediction-system"
Repository = "https://github.com/arifaziz9162/customer-churn-prediction-system"
Issues = "https://github.com/arifaziz9162/customer-churn-prediction-system/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["customer_churn_prediction*"]

# -------------
# Black
# -------------

[tool.black]
line-length = 88
target-version = ["py311"]

exclude = '''
/(
    \.git
  | __pycache__
  | artifacts
  | notebooks
  | mlruns
  | logs
  | \.pytest_cache
  | .*\.egg-info
)/
'''

# -------------
# Ruff
# -------------

[tool.ruff]
line-length = 88
target-version = "py311"

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "artifacts",
    "notebooks",
    "mlruns",
    "logs",
    "*.egg-info"
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W",
    "UP",
    "B"
]

ignore = [
    "E501"
]

# -------------
# Pytest
# -------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -q"

# -------------
# Coverage
# -------------

[tool.coverage.run]
source = ["src", "serving"]
omit = ["*/__init__.py"]
[tool.coverage.report]
show_missing = true
skip_covered = true
