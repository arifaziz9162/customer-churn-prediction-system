global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: customer-churn-service
    metrics_path: /metrics
    static_configs:
      - targets: ["bento:3000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9000"]
