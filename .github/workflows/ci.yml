name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:

  # Code quality checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Display Python Version
        run: |
          python --version
          pip --version

      - name: Verify Repository Structure
        run: |
          test -d src
          test -d serving
          test -d deployment
          test -d config
          test -d notebooks
          test -d migrations
          test -d airflow

          test -f main.py
          test -f requirements.txt
          test -f requirements-dev.txt
          test -f pyproject.toml
          test -f dvc.yaml
          test -f dvc.lock
          test -f docker-compose.dev.yml
          test -f docker-compose.prod.yml
          test -f docker-compose.airflow.yml
          test -f alembic.ini
          test -f bentofile.yaml

      - name: Verify Configuration Files
        run: |
          test -f config/config.yaml
          test -f config/params.yaml
          test -f config/schema.yaml

      - name: Verify Serving Structure
        run: |
          test -f serving/service.py
          test -f serving/config.py
          test -f serving/constants.py
          test -d serving/schemas
          test -d serving/services
          test -d serving/persistence
          test -d serving/metrics

      - name: Verify Deployment Structure
        run: |
          test -f deployment/docker/Dockerfile
          test -d deployment/k8s/base
          test -d deployment/k8s/base/monitoring/prometheus
          test -d deployment/k8s/base/monitoring/grafana
          test -f deployment/k8s/base/kustomization.yaml

      - name: Run Ruff (training package)
        run: |
          ruff check \
          src \
          main.py \
          migrations \
          airflow

      - name: Run Ruff (serving package)
        run: |
          ruff check serving

      - name: Check Black Formatting (training package)
        run: |
          black --check \
          src \
          main.py \
          migrations \
          airflow

      - name: Check Black Formatting (serving package)
        run: |
          black --check serving

      - name: Check Airflow DAG Syntax
        run: |
          python -m py_compile airflow/dags/wine_quality_dag.py

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality
          path: |
            .ruff_cache
            .pytest_cache
          if-no-files-found: ignore
          retention-days: 7

  # Project validation
  validation:
    name: Project Validation
    needs: code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: customer_churn_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      ENV: testing
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: wine_quality_db
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Display Python Version
        run: python --version

      - name: Validate YAML files
        run: |
          python << 'PYEOF'
          import yaml
          from pathlib import Path

          for file in Path(".").rglob("*.yml"):
              with open(file, "r") as f:
                  list(yaml.safe_load_all(f))

          for file in Path(".").rglob("*.yaml"):
              with open(file, "r") as f:
                  list(yaml.safe_load_all(f))

          print("All YAML files are valid.")
          PYEOF

      - name: Verify DVC Files
        run: |
          test -f dvc.yaml
          test -f dvc.lock
          test -d .dvc


      - name: Verify Serving Structure
        run: |
          test -d serving/schemas
          test -d serving/services
          test -d serving/persistence
          test -d serving/metrics

          test -f serving/service.py
          test -f serving/config.py
          test -f serving/constants.py
          test -f requirements.txt

      - name: Verify Deployment Structure
        run: |
          test -d deployment/k8s/base
          test -d deployment/k8s/base/monitoring

          test -f deployment/docker/Dockerfile
          test -f deployment/k8s/base/kustomization.yaml

      - name: Verify Airflow Structure
        run: |
          test -f airflow/Dockerfile
          test -f airflow/README.md
          test -f airflow/dags/customer_churn_dag.py

      - name: Verify Alembic Migrations
        run: |
          test -f alembic.ini
          test -d migrations/versions

      - name: Validate Migration Syntax
        run: |
          for f in migrations/versions/*.py; do
            python -m py_compile "$f"
          done

      - name: Verify Source Package
        run: |
          python -c "import wine_quality_prediction"
          python -c "from wine_quality_prediction.components import ModelTrainer, ModelEvaluation, ModelRegistry"

      - name: Validate Docker Compose Files
        run: |
          cat > .env << 'EOF'
          DB_USER=postgres
          DB_PASSWORD=ci_password
          DB_NAME=wine_quality_db
          AWS_ACCOUNT_ID=000000000000
          AWS_REGION=ap-south-1
          GRAFANA_ADMIN_PASSWORD=ci_grafana_password
          EOF

          docker compose -f docker-compose.prod.yml config
          docker compose -f docker-compose.dev.yml config

      - name: Validate Airflow Compose File
        run: |
          docker compose -f docker-compose.airflow.yml config

      - name: Upload Validation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            .pytest_cache
          if-no-files-found: ignore
          retention-days: 7

  # Training-side unit + integration tests (dagshub env - no bentoml)
  tests:

    name: Tests (Training)

    needs:
      - code-quality
      - validation

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Display Python Version
        run: |
          python --version
          pip --version

      - name: Run Training + Pipeline Tests
        run: |
          python -m pytest \
            tests/unit \
            tests/integration \
            --verbose \
            --tb=short \
            --maxfail=5 \
            --disable-warnings \
            --junitxml=test-results.xml \
            --cov=src/customer_churn_prediction \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term

      - name: Upload Tests Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov
          if-no-files-found: ignore
          retention-days: 7

  # Serving-side tests (bentoml env - deliberately NOT installed alongside
  # dagshub; see CHANGES.md "Third correction" for why these two package
  # sets cannot share one environment)
  tests-serving:
    name: Tests (Serving)
    needs:
      - code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Serving Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov
          python -m pip install -e . --no-deps

      - name: Display Python Version
        run: |
          python --version
          pip --version

      - name: Run Serving Tests
        run: |
          python -m pytest \
            tests/serving \
            --verbose \
            --tb=short \
            --maxfail=5 \
            --disable-warnings \
            --junitxml=test-results-serving.xml \
            --cov=serving \
            --cov-report=xml \
            --cov-report=term

      - name: Upload Serving Tests Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-serving
          path: test-results-serving.xml
          if-no-files-found: ignore
          retention-days: 7

  summary:
    name: CI Summary
    needs:
      - code-quality
      - validation
      - tests
      - tests-serving
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: CI Summary
        run: |
          {
            echo "# Continuous Integration Summary"
            echo ""
            echo "## Pipeline Results"
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Code Quality | Completed |"
            echo "| Project Validation | Completed |"
            echo "| Tests (Training) | Completed |"
            echo "| Tests (Serving) | Completed |"
            echo ""
            echo "## Workflow Information"
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Actor: $GITHUB_ACTOR"
            echo "- Workflow: $GITHUB_WORKFLOW"
            echo "- Run Id: $GITHUB_RUN_ID"
            echo "- Runner: $RUNNER_OS"
            echo ""
            echo "Continuous Integration workflow completed successfully."
          } >> $GITHUB_STEP_SUMMARY
