stages:
  data_ingestion:
    cmd: python -m customer_churn_prediction.pipeline.stage_01_data_ingestion
    deps:
      - src/customer_churn_prediction/components/data_ingestion.py
      - src/customer_churn_prediction/pipeline/stage_01_data_ingestion.py
      - src/customer_churn_prediction/config/configuration.py
      - src/customer_churn_prediction/entity/config_entity.py
      - src/customer_churn_prediction/utils/common.py
      - config/config.yaml
    outs:
      - artifacts/data_ingestion/raw_data.csv
      - artifacts/data_ingestion/status.json

  data_validation:
    cmd: python -m customer_churn_prediction.pipeline.stage_02_data_validation
    deps:
      - src/customer_churn_prediction/components/data_validation.py
      - src/customer_churn_prediction/pipeline/stage_02_data_validation.py
      - src/customer_churn_prediction/config/configuration.py
      - src/customer_churn_prediction/entity/config_entity.py
      - src/customer_churn_prediction/utils/common.py
      - config/config.yaml
      - config/schema.yaml
      - artifacts/data_ingestion/raw_data.csv
    outs:
      - artifacts/data_validation/status.json

  data_transformation:
    cmd: python -m customer_churn_prediction.pipeline.stage_03_data_transformation
    deps:
      - src/customer_churn_prediction/components/data_transformation.py
      - src/customer_churn_prediction/pipeline/stage_03_data_transformation.py
      - src/customer_churn_prediction/config/configuration.py
      - src/customer_churn_prediction/entity/config_entity.py
      - src/customer_churn_prediction/utils/common.py
      - config/config.yaml
      - config/schema.yaml
      - artifacts/data_ingestion/raw_data.csv
      - artifacts/data_validation/status.json
    params:
      - config/params.yaml:
          - TRAINING.TEST_SIZE
          - TRAINING.RANDOM_STATE
    outs:
      - artifacts/data_transformation/train.csv
      - artifacts/data_transformation/test.csv
      - artifacts/data_transformation/status.json

  model_trainer:
    cmd: python -m customer_churn_prediction.pipeline.stage_04_model_trainer
    deps:
      - src/customer_churn_prediction/pipeline/stage_04_model_trainer.py
      - src/customer_churn_prediction/components/model_trainer.py
      - src/customer_churn_prediction/config/configuration.py
      - src/customer_churn_prediction/entity/config_entity.py
      - src/customer_churn_prediction/utils/common.py
      - config/config.yaml
      - config/params.yaml
      - config/schema.yaml
      - artifacts/data_transformation/train.csv
    params:
      - config/params.yaml:
          - TRAINING.RANDOM_STATE
          - TRAINING.CV_FOLDS
          - TRAINING.SCORING
          - BAYESIAN_OPTIMIZATION
          - RANDOM_FOREST_SEARCH_SPACE
          - THRESHOLD_SELECTION
    outs:
      - artifacts/model_trainer/model.joblib
      - artifacts/model_trainer/training_summary.json
      - artifacts/model_trainer/threshold_sweep.csv
      - artifacts/model_trainer/status.json

  model_evaluation:
    cmd: python -m customer_churn_prediction.pipeline.stage_05_model_evaluation
    deps:
      - src/customer_churn_prediction/pipeline/stage_05_model_evaluation.py
      - src/customer_churn_prediction/components/model_evaluation.py
      - src/customer_churn_prediction/config/configuration.py
      - src/customer_churn_prediction/entity/config_entity.py
      - src/customer_churn_prediction/utils/common.py
      - config/config.yaml
      - config/params.yaml
      - artifacts/data_transformation/test.csv
      - artifacts/model_trainer/model.joblib
      - artifacts/model_trainer/training_summary.json
      - artifacts/model_trainer/threshold_sweep.csv
    params:
      - config/params.yaml:
          - TRAINING.RANDOM_STATE
          - MODEL_EVALUATION
          - THRESHOLD_SELECTION
    metrics:
      - artifacts/model_evaluation/metrics.json
    outs:
      - artifacts/model_evaluation/status.json

  model_registry:
    cmd: python -m customer_churn_prediction.pipeline.stage_06_model_registry
    deps:
      - src/customer_churn_prediction/pipeline/stage_06_model_registry.py
      - src/customer_churn_prediction/components/model_registry.py
      - src/customer_churn_prediction/config/configuration.py
      - src/customer_churn_prediction/entity/config_entity.py
      - src/customer_churn_prediction/utils/common.py
      - config/config.yaml
      - config/params.yaml
      - artifacts/data_transformation/test.csv
      - artifacts/model_evaluation/metrics.json
      - artifacts/model_trainer/training_summary.json
    params:
      - config/params.yaml:
          - MODEL_REGISTRY
    outs:
      - artifacts/model_registry/registry_report.json
      - artifacts/model_registry/status.json

  model_packaging:
    cmd: python -m customer_churn_prediction.pipeline.stage_07_model_packaging
    deps:
      - src/customer_churn_prediction/pipeline/stage_07_model_packaging.py
      - src/customer_churn_prediction/components/model_packaging.py
      - src/customer_churn_prediction/config/configuration.py
      - src/customer_churn_prediction/entity/config_entity.py
      - src/customer_churn_prediction/utils/common.py
      - config/config.yaml
      - config/params.yaml
      - artifacts/model_registry/registry_report.json
      - artifacts/model_registry/status.json
    outs:
      - artifacts/model_packaging/packaging_report.json
      - artifacts/model_packaging/status.json
